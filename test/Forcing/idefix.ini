[Grid]

X1-grid   1   0.0   64     u   1.
X2-grid   1   0.0   64     u   1.
X3-grid   1   0.0    1     u   1.


[TimeIntegrator]

CFL              0.8
CFL_max_var      1.1
tstop            50.
first_dt         1.e-6
nstages          3

[Hydro]

solver         hll
emf            uct_hll
csiso          constant   1.

[Boundary]

X1-beg        reflective
X1-end        reflective
X2-beg        periodic
X2-end        periodic
X3-beg        periodic
X3-end        periodic

rklFlux false
zeroEmf false

[Forcing]

#iso2D IDIR  29.  32.  write
ani3D IDIR  bothhomdir  chebyshev  30.  31.  write
#iso2D  IDIR  54.  58. write
#iso2D  IDIR  4. 8.
#solenoidal fd
t_corr  5.
epsilon 5e-1
#stoptime 40.
seed    0
#write   1
filename output

[Setup]

amp    1e-6

[Output]

uservar     BTA  PSR
vtk         5.
vtk_dir     vtk
log         100
analysis    0.5
folder      output
dmp         10.

